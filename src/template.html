<title>Fine Print Proofer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  /* Layout: a sheet of copy on the left, proofreader's margin notes on the right. Marks follow proof convention: wavy = wrong, highlighter = house style, dotted = consider. */
  :root {
    --bg: #EDEAE3;
    --paper: #FBFAF7;
    --ink: #201D1A;
    --ink2: #5C554C;
    --line: #DAD4C8;
    --chip: #F2EEE6;
    --accent: #27466E;
    --accent-ink: #FFFFFF;
    --err: #B3261E;
    --err-bg: rgba(179, 38, 30, 0.07);
    --sty: #9A5F08;
    --sty-bg: rgba(214, 150, 30, 0.17);
    --hint: #4A6F92;
    --sel-bg: rgba(39, 70, 110, 0.17);
    --font-serif: 'Source Serif 4', 'Iowan Old Style', Georgia, serif;
    --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141210; --paper: #1B1815; --ink: #ECE6DB; --ink2: #A79E91; --line: #34302A; --chip: #252220;
      --accent: #9DB9E3; --accent-ink: #14110F; --err: #F2877E; --err-bg: rgba(242, 135, 126, 0.13);
      --sty: #E6B04A; --sty-bg: rgba(230, 176, 74, 0.17); --hint: #8FAAC7; --sel-bg: rgba(157, 185, 227, 0.24);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141210; --paper: #1B1815; --ink: #ECE6DB; --ink2: #A79E91; --line: #34302A; --chip: #252220;
    --accent: #9DB9E3; --accent-ink: #14110F; --err: #F2877E; --err-bg: rgba(242, 135, 126, 0.13);
    --sty: #E6B04A; --sty-bg: rgba(230, 176, 74, 0.17); --hint: #8FAAC7; --sel-bg: rgba(157, 185, 227, 0.24);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .brand { font: 600 26px/1.1 var(--font-serif); letter-spacing: -0.01em; margin: 0; }
  .brand em { font-weight: 400; font-style: italic; color: var(--ink2); }
  .tagline { margin: 0; color: var(--ink2); font-size: 13px; max-width: 52ch; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (min-width: 940px) { .grid { grid-template-columns: minmax(0, 1fr) 380px; } }

  .sheet-wrap { min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  .toolbar .spacer { flex: 1 1 auto; }
  .btn { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 5px 11px; font-size: 13px; }
  .btn:hover { border-color: var(--ink2); }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .stats { font: 12px var(--font-mono); color: var(--ink2); font-variant-numeric: tabular-nums; }

  .sheet { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; min-height: 420px; }
  .sheet .layer, .sheet textarea {
    font: 400 18px/1.75 var(--font-serif); font-variant-ligatures: none; font-kerning: none; letter-spacing: 0; tab-size: 4;
    padding: 28px max(18px, 4%) 40px; margin: 0; border: 0; width: 100%;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;
  }
  .layer { position: relative; color: transparent; pointer-events: none; min-height: 420px; }
  .sheet textarea { position: absolute; inset: 0; height: 100%; resize: none; overflow: hidden; background: transparent; color: var(--ink); caret-color: var(--accent); outline: none; }
  .sheet:focus-within { border-color: var(--ink2); }
  .layer mark { color: transparent; background: transparent; border-radius: 2px; }
  .m-error { text-decoration: underline wavy var(--err); text-decoration-thickness: 1.5px; text-underline-offset: 4px; background: var(--err-bg) !important; }
  .m-style { background: var(--sty-bg) !important; box-shadow: inset 0 -2px 0 var(--sty); }
  .m-hint { text-decoration: underline dotted var(--hint); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .layer mark.sel { background: var(--sel-bg) !important; outline: 1.5px solid var(--accent); outline-offset: 0; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 2px 0; font-size: 12px; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { display: inline-block; width: 26px; height: 12px; border-radius: 2px; }
  .sw.e { background: var(--err-bg); border-bottom: 2px dotted var(--err); }
  .sw.s { background: var(--sty-bg); border-bottom: 2px solid var(--sty); }
  .sw.h { border-bottom: 2px dotted var(--hint); }

  aside.margin { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; }
  @media (min-width: 940px) { aside.margin { position: sticky; top: 14px; max-height: calc(100vh - 28px); } }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab { flex: 1; background: none; border: 0; padding: 11px 12px; font-weight: 500; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .pane { overflow: auto; min-height: 0; flex: 1; }

  .summary { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .count { font: 600 22px/1.2 var(--font-serif); }
  .count small { font: 400 13px var(--font-ui); color: var(--ink2); margin-left: 6px; }
  .loadbar { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 12px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--hint); }
  .chip[data-sev="error"] i { background: var(--err); }
  .chip[data-sev="style"] i { background: var(--sty); }
  .chip b { font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="false"] { opacity: 0.5; text-decoration: line-through; }

  .note { padding: 12px 16px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .note:hover { background: var(--chip); }
  .note.sel { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
  .note-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font: 500 11px var(--font-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink2); }
  .tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--hint); flex: none; }
  .sev-error .tag i { background: var(--err); }
  .sev-style .tag i { background: var(--sty); }
  .rule { font-weight: 600; font-size: 13px; }
  .snip { margin: 6px 0 2px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; }
  .was { font: 400 14px var(--font-mono); text-decoration: line-through; text-decoration-color: var(--err); color: var(--ink2); max-width: 100%; overflow-wrap: anywhere; }
  .was.plain { text-decoration: none; color: var(--ink); }
  .arrow { color: var(--ink2); }
  .fix { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 5px; padding: 1px 9px; font: 500 13px var(--font-mono); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fix:hover { background: var(--accent); color: var(--accent-ink); }
  .msg { margin: 4px 0 0; color: var(--ink); font-size: 13px; }
  .ref { margin: 8px 0 0; padding: 0 0 0 10px; border-left: 2px solid var(--line); font: italic 400 13px/1.5 var(--font-serif); color: var(--ink2); }
  .ref b { font: 500 10px var(--font-mono); font-style: normal; letter-spacing: 0.07em; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--ink2); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
  .linkbtn:hover { color: var(--ink); }
  .note-foot { margin-top: 8px; display: flex; gap: 14px; }
  .empty { padding: 28px 18px; color: var(--ink2); }
  .empty strong { display: block; font: 600 17px var(--font-serif); color: var(--ink); margin-bottom: 4px; }
  .more { padding: 12px 16px; }

  .rules { padding: 14px 16px 22px; }
  .rules h3 { font: 500 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); margin: 18px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .rules h3:first-child { margin-top: 0; padding-top: 0; border: 0; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field select { border: 1px solid var(--line); background: var(--chip); border-radius: 6px; padding: 6px 8px; }
  .rules label.r { display: flex; gap: 9px; align-items: flex-start; padding: 3px 0; font-size: 13px; }
  .rules label.r input { margin-top: 3px; }
  .rules label.r.cat { font-weight: 600; padding-top: 8px; }
  .hintline { color: var(--ink2); font-size: 12px; margin: 4px 0 0; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.18s; z-index: 20; }
  .toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">Fine Print <em>Proofer</em></h1>
    <p class="tagline">Spelling, grammar and the Fine Print house style, checked by rules. No language model, and nothing leaves your browser.</p>
  </header>

  <div class="grid">
    <section class="sheet-wrap" aria-label="Text to check">
      <div class="toolbar">
        <button class="btn" id="btn-sample" type="button">Load sample</button>
        <button class="btn" id="btn-clear" type="button">Clear</button>
        <button class="btn" id="btn-undo" type="button" disabled>Undo fix</button>
        <button class="btn" id="btn-copy" type="button">Copy text</button>
        <span class="spacer"></span>
        <span class="stats" id="stats" aria-live="polite"></span>
      </div>
      <div class="sheet">
        <div class="layer" id="layer" aria-hidden="true"></div>
        <textarea id="ed" spellcheck="false" autocomplete="off" autocapitalize="off" lang="en-GB" aria-label="Your text" placeholder="Paste or type text here."></textarea>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i class="sw e"></i>Spelling or grammar</span>
        <span><i class="sw s"></i>Breaks the style guide</span>
        <span><i class="sw h"></i>Worth a second look</span>
      </div>
    </section>

    <aside class="margin" aria-label="Notes">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-notes" aria-selected="true" aria-controls="pane-notes" type="button">Notes</button>
        <button class="tab" role="tab" id="tab-rules" aria-selected="false" aria-controls="pane-rules" type="button">Rules</button>
      </div>
      <div class="pane" id="pane-notes" role="tabpanel" aria-labelledby="tab-notes">
        <div class="summary">
          <div class="count" id="count"></div>
          <div class="loadbar" id="loadbar"></div>
          <div class="chips" id="chips"></div>
        </div>
        <div id="notes"></div>
      </div>
      <div class="pane rules" id="pane-rules" role="tabpanel" aria-labelledby="tab-rules" hidden></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>/*@@NSPELL@@*/</script>
<script>/*@@DICT@@*/</script>
<script>/*@@ENGINE@@*/</script>
